<!doctype html>
<html lang="en">
<head>

      <nav aria-label="Views">

          <span>Home</span>
        </a>
        <a href="#/discover" class="nav-item" data-nav="discover" aria-label="Discover">

      </nav>
    </div>
    <div id="demo-banner"></div>
    <div id="update-banner"></div>

  <main>
    <div id="view"></div>

  <footer>
    <p class="explainer">Cabal is for promoting your own games. A disclaimer states the terms; it is not a shield. <a href="#/terms">Read the terms</a>.</p>
  </footer>
  <script type="module" src="app.js"></script>
